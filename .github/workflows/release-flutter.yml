name: Release — Flutter POS, Staff & Rider Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows-pos:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/pos-flutter/apps/windows_pos
        run: |
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-pos-release
          path: apps/pos-flutter/apps/windows_pos/build/windows/x64/runner/Release/

  build-android-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/pos-flutter/apps/android_staff
        run: |
          flutter pub get
          flutter build apk --release
      - working-directory: apps/pos-flutter/apps/rider_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-staff-apk
          path: apps/pos-flutter/apps/android_staff/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rider-app-apk
          path: apps/pos-flutter/apps/rider_app/build/app/outputs/flutter-apk/app-release.apk
